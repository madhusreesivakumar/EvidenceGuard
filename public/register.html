<!DOCTYPE html>

<head>

</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">ðŸ”</div> EvidenceGuard
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">ðŸ“Š</span> Dashboard</a>
        <a href="upload.html" class="nav-item"><span class="nav-icon">â¬†</span> Upload Evidence</a>
        <a href="records.html" class="nav-item"><span class="nav-icon">ðŸ—‚</span> Evidence Records</a>
        <a href="verify.html" class="nav-item"><span class="nav-icon">âœ…</span> Verify Evidence</a>
        <a href="blockchain.html" class="nav-item"><span class="nav-icon">â›“</span> Blockchain</a>
        <a href="audit.html" class="nav-item"><span class="nav-icon">ðŸ“‹</span> Audit Trail</a>
        <a href="users.html" class="nav-item"><span class="nav-icon">ðŸ‘¥</span> Users</a>
        <a href="about.html" class="nav-item"><span class="nav-icon">â„¹ï¸</span> About</a>
      </nav>
      <div class="sidebar-footer">
        <div id="sidebarUserName" style="font-weight:bold;"></div>
        <div id="sidebarUserRole" style="font-size:0.8rem; color: var(--text-muted);"></div>
        <a href="#" id="logoutBtn" style="color:var(--status-tampered); display:block; margin-top:10px;">ðŸšª Logout</a>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="hamburger" id="hamburger">â˜°</button>
          <h1 id="pageTitle" style="font-size:1.2rem; margin:0;">Register</h1>
        </div>
        <div class="topbar-right">
          <span class="live-clock" id="liveClock"></span>
          <div class="user-area">
            <span class="badge" style="background:var(--status-verified); color:white;">System Online</span>
          </div>
        </div>
      </header>

      <main class="main-content">
        <div class="glass-card" style="max-width: 400px; margin: 40px auto; padding: 30px;">
          <h2 style="text-align: center; margin-bottom: 20px;">Create Account</h2>
          <div id="msgBox" style="margin-bottom: 15px; text-align: center; display: none; padding: 10px; border-radius: 4px;"></div>
          <form id="registerForm">
            <div style="margin-bottom: 15px;">
              <label for="name" style="display: block; margin-bottom: 5px;">Name</label>
              <input type="text" id="name" required minlength="2" maxlength="60" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
            </div>
            <div style="margin-bottom: 15px;">
              <label for="email" style="display: block; margin-bottom: 5px;">Email</label>
              <input type="email" id="email" required style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
            </div>
            <div style="margin-bottom: 15px;">
              <label for="password" style="display: block; margin-bottom: 5px;">Password</label>
              <input type="password" id="password" required style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
              <small style="color: var(--text-muted); display: block; margin-top: 5px;">Min 8 chars, 1 letter, 1 number</small>
            </div>
            <div style="margin-bottom: 20px;">
              <label for="confirmPassword" style="display: block; margin-bottom: 5px;">Confirm Password</label>
              <input type="password" id="confirmPassword" required style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
            </div>
            <button type="submit" id="registerBtn" class="btn btn-primary" style="width: 100%; justify-content: center;">Register</button>
          </form>
          <div style="text-align: center; margin-top: 20px;">
            <a href="login.html" style="color: var(--accent); text-decoration: none;">Already have an account? Login</a>
          </div>
        </div>
      </main>

      <footer class="page-footer">
        &copy; 2026 EvidenceGuard
      </footer>
    </div>
  </div>

</body>
</html>

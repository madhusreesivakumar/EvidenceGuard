<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EvidenceGuard</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <script src="page-logic.js" defer></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">ðŸ”</div> EvidenceGuard
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">&#9700;</span> Dashboard</a>
        <a href="upload.html" class="nav-item"><span class="nav-icon">&#8679;</span> Upload Evidence</a>
        <a href="records.html" class="nav-item"><span class="nav-icon">&#9776;</span> Evidence Records</a>
        <a href="verify.html" class="nav-item"><span class="nav-icon">&#10003;</span> Verify Evidence</a>
        <a href="blockchain.html" class="nav-item"><span class="nav-icon">&#9741;</span> Blockchain</a>
        <a href="audit.html" class="nav-item"><span class="nav-icon">&#9741;</span> Audit Trail</a>
        <a href="users.html" class="nav-item"><span class="nav-icon">&#9786;</span> Users</a>
        <a href="about.html" class="nav-item"><span class="nav-icon">&#9432;</span> About</a>
      </nav>
      <div class="sidebar-footer">
        <div id="sidebarUserName" style="font-weight:bold;"></div>
        <div id="sidebarUserRole" style="font-size:0.8rem; color: var(--text-muted);"></div>
        <a href="#" id="logoutBtn" style="color:var(--status-tampered); display:block; margin-top:10px;">ðŸšª Logout</a>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="hamburger" id="hamburger">â˜°</button>
          <h1 id="pageTitle" style="font-size:1.2rem; margin:0;">Login</h1>
        </div>
        <div class="topbar-right">
          <span class="live-clock" id="liveClock"></span>
          <div class="user-area">
            <span class="badge" style="background:var(--status-verified); color:white;">System Online</span>
          </div>
        </div>
      </header>

      <main class="main-content">
        <div class="glass-card" style="max-width: 400px; margin: 40px auto; padding: 30px;">
          <h2 style="text-align: center; margin-bottom: 20px;">Welcome Back</h2>
          <div id="errorMsg" style="color: var(--status-tampered); margin-bottom: 15px; text-align: center; display: none;"></div>
          <form id="loginForm">
            <div style="margin-bottom: 15px;">
              <label for="email" style="display: block; margin-bottom: 5px;">Email / Username</label>
              <input type="email" id="email" required style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
            </div>
            <div style="margin-bottom: 20px;">
              <label for="password" style="display: block; margin-bottom: 5px;">Password</label>
              <div style="display: flex; gap: 10px;">
                <input type="password" id="password" required style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
                <button type="button" id="togglePassword" class="btn btn-secondary" style="padding: 0 15px;">Show</button>
              </div>
            </div>
            <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; justify-content: center;">Login</button>
          </form>

          <div style="margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 15px;">
            <div style="font-size: 0.82rem; color: var(--text-muted); text-align: center; margin-bottom: 10px;">⚡ Quick Demo Login Shortcuts:</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <button type="button" class="btn btn-secondary" id="quickAdminBtn" style="font-size: 0.85rem; justify-content: center;">🔑 Login as Admin (admin@eg.local)</button>
              <button type="button" class="btn btn-secondary" id="quickInvestBtn" style="font-size: 0.85rem; justify-content: center;">🕵️ Login as Investigator (invest@eg.local)</button>
            </div>
          </div>

          <div style="text-align: center; margin-top: 20px;">
            <a href="register.html" style="color: var(--accent); text-decoration: none;">Don't have an account? Register</a>
          </div>
        </div>
      </main>

      <footer class="page-footer">
        &copy; 2026 EvidenceGuard
      </footer>
    </div>
  </div>

</body>
</html>

version: '3.8'

services:
  mailhog:
    image: mailhog/mailhog:latest
    container_name: evidenceguard-mailhog
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    restart: unless-stopped

  # Optional local MongoDB for development
  mongodb:
    image: mongo:7.0
    container_name: evidenceguard-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  # MinIO Local S3-compatible Object Storage (Sprint 11)
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: evidenceguard-minio
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  mongo_data:
  minio_data:
